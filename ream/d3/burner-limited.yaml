apiVersion: apps/v1
kind: Deployment
metadata:
  name: burner-limited
spec:
  replicas: 2
  selector:
    matchLabels:
      app: burner-limited
  template:
    metadata:
      labels:
        app: burner-limited
    spec:
      containers:
      - command:
        - python
        - -c
        - 'while True: pass'
        image: reaam02/aidc-serving:cpu-v1
        name: burner
        resources:
          limits:
            cpu: 500m
