apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: team
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.27.1
          args:
            - --model=Qwen/Qwen2.5-1.5B-Instruct-AWQ
            - --quantization=awq
            - --dtype=half
            - --max-model-len=4096
            - --gpu-memory-utilization=0.85
          ports:
            - containerPort: 8000
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: serving-keys
                  key: api-key
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
      volumes:
        - name: hf-cache
          hostPath:
            path: /var/lib/hf-cache
            type: DirectoryOrCreate
