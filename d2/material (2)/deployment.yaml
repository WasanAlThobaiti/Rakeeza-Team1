apiVersion: apps/v1
kind: Deployment
metadata:
name: serving
spec:
replicas: 2
selector:
matchLabels:
app: serving
template:
metadata:
labels:
app: serving
spec:
containers:
- name: serving
image: wasanfaiz/aidc-serving:cpu-v1
ports:
- containerPort: 8000
env:
- name: MODEL_BACKEND
value: echo
- name: MODEL_ID
value: Qwen/Qwen2.5-0.5B-Instruct
- name: APP_VERSION
value: v2
livenessProbe:
httpGet:
path: /health
port: 8000
initialDelaySeconds: 20
timeoutSeconds: 1
periodSeconds: 10
failureThreshold: 3
readinessProbe:
httpGet:
path: /health
port: 8000
initialDelaySeconds: 0
timeoutSeconds: 1
periodSeconds: 2
failureThreshold: 2
